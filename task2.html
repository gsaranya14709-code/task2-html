<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studentform</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <form>
        <table align="center" cellpadding="8">
            <tr>
                <td><b>Roll no. :</b></td>
                <td><input type="text" size="47"></td>
            </tr>
            <tr>
                <td><b>Student name :</b></td>
                <td><input type="text" placeholder="First Name">-<input type="text" placeholder="Last Name"></td>
            </tr>
            <tr>
                <td><b>Father's name :</b></td>
                <td><input type="text" size="47"></td>
            </tr>
            <tr>
                <td><b>Date of birth :</b></td>
                <td>
                    <select>
                        <option><b>Day</b></option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>
                    <select>
                        <option><b>Month</b></option>
                        <option>January</option>
                        <option>Febraury</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <opption>December</opption>
                    </select>
                    <select>
                        <option><b>Year</b></option>
                        <option>2009</option>
                        <option>2010</option>
                    </select>
                    <i>(DD-MM-YYYY)</i>
                </td>
            </tr>
            <tr>
                <td><b>Mobile no. :</b></td>
                <td>
                    <input type="text" value="+91" size="2">-<input type="tel" size="39">
                </td>
            </tr>
            <tr>
                <td><b>Email id :</b></td>
                <td><input type="email" size="47"></td>
            </tr>
            <tr>
                <td><b>Password :</b></td>
                <td><input type="password" size="47"></td>
            </tr>
            <tr>
                <td><b>Gender</b></td>
                <td>
                    <input type="radio" name="gender">Male
                    <input type="radio" name="gender">Female
                </td>
            </tr>
            <tr>
                <td><b>Department :</b></td>
                <td>
                    <input type="checkbox">CSE 
                    <input type="checkbox">IT 
                    <input type="checkbox">ECE 
                    <input type="checkbox">Civil 
                    <input type="checkbox">Mech 
                </td>
            </tr>
            <tr>
                <td><b>Course :</b></td>
                <td>
                    <select>
                        <option>-------------------- Select Current Course's ---------------------</option>
                        <option>B.E </option>
                        <option>B. Tech</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><b>Student photo :</b></td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td><b>City :</b></td>
                <td><input type="text" size="47"></td>
            </tr>
            <tr>
                <td><b>Address :</b></td>
                <td><textarea rows="5" cols="47"></textarea></td>
            </tr>            
        </table>
    </form>
</body>
</html>
